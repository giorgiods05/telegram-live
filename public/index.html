<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stream</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: sans-serif;
           display: flex; justify-content: center; align-items: center;
           height: 100vh; text-align: center; }
    #message { font-size: 18px; padding: 20px; line-height: 1.6; }
    #player { width: 100%; height: 100vh; display: none; }
  </style>
</head>
<body>
  <div id="message">⏳ Caricamento in corso...</div>
  <video id="player" controls playsinline autoplay></video>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    async function init() {
      try {
        const res = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: tg.initData })
        });
        if (!res.ok) {
          document.getElementById('message').innerHTML = '🔒 Accesso negato.<br>Devi essere iscritto al canale.';
          return;
        }
        const { streamUrl } = await res.json();
        const video = document.getElementById('player');
        document.getElementById('message').style.display = 'none';
        video.style.display = 'block';

        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(streamUrl);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = streamUrl;
          video.play();
        } else {
          document.getElementById('message').innerHTML = '❌ Browser non supportato.';
        }
      } catch (e) {
        document.getElementById('message').innerHTML = '❌ Errore di connessione.';
      }
    }
    init();
  </script>
</body>
</html>
