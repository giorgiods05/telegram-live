<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stream</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #message { color: #fff; font-family: sans-serif; font-size: 18px;
               padding: 20px; line-height: 1.6; text-align: center;
               position: fixed; top: 50%; left: 50%;
               transform: translate(-50%, -50%); }
    #wrapper { display: none; position: fixed;
               top: 0; left: 0; width: 100%; height: 100%; }
    #yt { position: absolute; top: 50%; left: 50%;
          width: 100%; height: calc(100% + 160px);
          transform: translate(-50%, -50%);
          border: none; }
    #banda-top { position: fixed; top: 0; left: 0;
                 width: 100%; height: 50px;
                 background: #000; z-index: 10; }
    #banda-bottom { position: fixed; bottom: 0; left: 0;
                    width: 100%; height: 50px;
                    background: #000; z-index: 10; }
    #click-guard { position: fixed; top: 0; left: 0;
                   width: 100%; height: 100%; z-index: 9;
                   background: transparent; }
    body.fullscreen #banda-top,
    body.fullscreen #banda-bottom { display: none; }
    body.fullscreen #yt { height: 100%; }
  </style>
</head>
<body>
  <div id="message">⏳ Caricamento in corso...</div>
  <div id="wrapper">
    <iframe id="yt" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    <div id="click-guard"></div>
    <div id="banda-top"></div>
    <div id="banda-bottom"></div>
  </div>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Blocca il menu contestuale ovunque
    document.addEventListener('contextmenu', e => { e.preventDefault(); return false; }, true);
    window.addEventListener('contextmenu', e => { e.preventDefault(); return false; }, true);
    // Blocca anche su elementi specifici
    document.addEventListener('mousedown', e => {
      if (e.button === 2) { e.preventDefault(); return false; }
    }, true);

    let controlsPassthrough = false;
    const guard = document.getElementById('click-guard');

    function checkFullscreen() {
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
      document.body.classList.toggle('fullscreen', isFs);
    }
    document.addEventListener('fullscreenchange', checkFullscreen);
    document.addEventListener('webkitfullscreenchange', checkFullscreen);

    async function init() {
      try {
        const res = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: tg.initData })
        });
        if (!res.ok) {
          const err = await res.json();
          document.getElementById('message').innerHTML = err.error === 'Non sei iscritto al canale'
            ? '🔒 Non sei iscritto al canale.'
            : '🔒 Accesso negato.';
          return;
        }
        const { youtubeVideoId } = await res.json();
        const iframe = document.getElementById('yt');
        iframe.src = `https://www.youtube.com/embed/${youtubeVideoId}?autoplay=0&controls=1&modestbranding=1&rel=0&showinfo=0&iv_load_policy=3&playsinline=1`;
        document.getElementById('message').style.display = 'none';
        document.getElementById('wrapper').style.display = 'block';
      } catch (e) {
        document.getElementById('message').innerHTML = '❌ Errore di connessione.';
      }
    }
    init();
  </script>
</body>
</html>
