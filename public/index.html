<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stream</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; color: #fff; font-family: sans-serif;
           display: flex; justify-content: center; align-items: center;
           height: 100vh; text-align: center; }
    #message { font-size: 18px; padding: 20px; }
    iframe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <div id="message">⏳ Verifica in corso...</div>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    async function init() {
      try {
        const res = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: tg.initData })
        });
        if (!res.ok) {
          document.getElementById('message').innerHTML = '🔒 Accesso negato.<br>Devi essere iscritto al canale.';
          return;
        }
        const { youtubeVideoId } = await res.json();
        document.getElementById('message').style.display = 'none';
        document.body.insertAdjacentHTML('beforeend',
          `<iframe src="https://www.youtube.com/embed/${youtubeVideoId}?autoplay=1"
           allow="autoplay; fullscreen" allowfullscreen></iframe>`);
      } catch (e) {
        document.getElementById('message').innerHTML = '❌ Errore di connessione.';
      }
    }
    init();
  </script>
</body>
</html>
