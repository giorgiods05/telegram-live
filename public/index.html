<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Stream</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #message { color: #fff; font-family: sans-serif; font-size: 18px;
               padding: 20px; line-height: 1.6; text-align: center;
               position: fixed; top: 50%; left: 50%;
               transform: translate(-50%, -50%); }
    #wrapper { display: none; position: fixed;
               top: 0; left: 0; width: 100%; height: 100%; }
    #yt { position: absolute; top: 50%; left: 50%;
          width: 100%; height: calc(100% - 120px);
          transform: translate(-50%, -50%);
          border: none; }
    #banda-top { position: fixed; top: 0; left: 0;
                 width: 100%; height: 60px;
                 background: #000; z-index: 10; }
    #banda-bottom { position: fixed; bottom: 0; left: 0;
                    width: 100%; height: 60px;
                    background: #000; z-index: 10; }
    #play-btn { position: fixed; top: 50%; left: 50%;
                transform: translate(-50%, -50%);
                z-index: 20; background: rgba(255,255,255,0.2);
                border: 2px solid white; border-radius: 50%;
                width: 80px; height: 80px; cursor: pointer;
                display: none; align-items: center; justify-content: center; }
    #play-btn svg { width: 36px; height: 36px; fill: white; margin-left: 6px; }
  </style>
</head>
<body>
  <div id="message">⏳ Caricamento in corso...</div>
  <div id="wrapper">
    <div id="banda-top"></div>
    <iframe id="yt" allow="autoplay; fullscreen" allowfullscreen></iframe>
    <div id="banda-bottom"></div>
    <div id="play-btn" onclick="startPlay()">
      <svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg>
    </div>
  </div>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    document.addEventListener('contextmenu', e => e.preventDefault());

    function startPlay() {
      const iframe = document.getElementById('yt');
      iframe.src = iframe.src.replace('autoplay=0', 'autoplay=1');
      document.getElementById('play-btn').style.display = 'none';
    }

    async function init() {
      try {
        const res = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: tg.initData })
        });
        if (!res.ok) {
          document.getElementById('message').innerHTML = '🔒 Accesso negato.<br>Devi essere iscritto al canale.';
          return;
        }
        const { youtubeVideoId } = await res.json();
        const iframe = document.getElementById('yt');
        iframe.src = `https://www.youtube.com/embed/${youtubeVideoId}?autoplay=0&controls=0&modestbranding=1&rel=0&showinfo=0&iv_load_policy=3`;
        document.getElementById('message').style.display = 'none';
        document.getElementById('wrapper').style.display = 'block';
        document.getElementById('play-btn').style.display = 'flex';
      } catch (e) {
        document.getElementById('message').innerHTML = '❌ Errore di connessione.';
      }
    }
    init();
  </script>
</body>
</html>
